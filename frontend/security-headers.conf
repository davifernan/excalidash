# NIL-667: the canonical set of security headers, included (not repeated) at
# every place nginx.conf.template needs them. nginx only inherits a parent
# block's `add_header` directives when the current `location` has none of its
# own -- the moment a location adds even one add_header, every inherited one
# silently stops applying to it. That is what dropped these headers from
# `/index.html`, `/runtime-config.js` and the cached-static-asset location
# the first time (all three set their own Cache-Control/Referrer-Policy).
#
# Fixing that by repeating the five lines in each location worked but left
# the same five lines byte-identical in four places -- exactly the kind of
# drift a later edit forgets to repeat everywhere (Hans-Friedrich's review of
# PR #231 caught precisely that: a first pass here missed `/runtime-config.js`).
# `include`-ing this file instead means there is exactly one place to change,
# and every included location still satisfies the "has its own add_header"
# condition -- an `include` pulls these `add_header` lines into the location
# block itself, so it is not the inheritance nginx silently skips.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:;" always;
