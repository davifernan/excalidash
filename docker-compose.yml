x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: excalidash-backend
    # A container without a memory limit can take the whole host with it. This
    # instance froze exactly that way: rendering a PDF spawned unbounded
    # Ghostscript processes, the machine ran out of RAM, started thrashing swap
    # and became unreachable — the container survived, the server did not.
    # memswap_limit equal to mem_limit means no swap at all for this container:
    # being killed is recoverable, dragging the host into swap is not.
    mem_limit: 1500m
    memswap_limit: 1500m
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=false
      # Optional for single-instance deployments:
      # if unset, backend auto-generates and persists one in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - ERROR_TRACKER_DSN=${ERROR_TRACKER_DSN:-}
      # --- Passwort-Reset per Mail -------------------------------------
      - ENABLE_PASSWORD_RESET=${ENABLE_PASSWORD_RESET:-false}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      # --- Versionshistorie --------------------------------------------
      - ENABLE_SNAPSHOT_COMPRESSION=${ENABLE_SNAPSHOT_COMPRESSION:-true}
      - SNAPSHOT_MAX_COUNT_PER_DRAWING=${SNAPSHOT_MAX_COUNT_PER_DRAWING:-100}
      - ENABLE_SNAPSHOT_VACUUM=${ENABLE_SNAPSHOT_VACUUM:-true}
      - IMPORT_MAX_SCENE_MEMORY_MB=${IMPORT_MAX_SCENE_MEMORY_MB:-64}
      - ASSET_RENDER_CONCURRENCY=${ASSET_RENDER_CONCURRENCY:-1}
      - ASSET_RENDER_QUEUE_LIMIT=${ASSET_RENDER_QUEUE_LIMIT:-32}
      - ASSET_PDF_SHRINK_CONCURRENCY=${ASSET_PDF_SHRINK_CONCURRENCY:-1}
      - ASSET_PDF_SHRINK_QUEUE_LIMIT=${ASSET_PDF_SHRINK_QUEUE_LIMIT:-2}
      - READINESS_CACHE_TTL_MS=${READINESS_CACHE_TTL_MS:-30000}
      # --- Sitzungsdauer -----------------------------------------------
      - JWT_REFRESH_EXPIRES_IN_REMEMBERED=${JWT_REFRESH_EXPIRES_IN_REMEMBERED:-30d}
      # # Local OIDC settings for dev compose.
      # - OIDC_PROVIDER_NAME=Keycloak
      # # Browser-facing issuer URL.
      # - OIDC_ISSUER_URL=http://localhost:8080/realms/excalidash/
      # # Backend-only discovery URL on the shared container network.
      # - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/excalidash/
      # - OIDC_CLIENT_ID=excalidash
      # # Local OIDC test secret; align with oidc/keycloak/realm-excalidash.json.
      # - OIDC_ID_TOKEN_SIGNED_RESPONSE_ALG=RS256
      # - OIDC_CLIENT_SECRET=excalidash-dev-secret
      # - OIDC_REDIRECT_URI=http://localhost:6767/api/auth/oidc/callback
      # - OIDC_SCOPES=openid profile email
      # - OIDC_ADMIN_GROUPS=admins
    volumes:
      - backend-data:/app/prisma
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Liveness only: readiness failures must not cause restart loops.
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: excalidash-frontend
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "6767:80"
    environment:
      # Backend URL for nginx proxy (host:port format, no protocol)
      # Override for reverse proxy setups (e.g., excalidash-backend.svc.cluster.local:8000)
      - BACKEND_URL=backend:8000
      - ERROR_TRACKER_DSN=${ERROR_TRACKER_DSN:-}
    depends_on:
      - backend
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  bugsink:
    image: bugsink/bugsink:2.5.0
    profiles: ["observability"]
    container_name: excalidash-bugsink
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "${BUGSINK_PORT:-8088}:8000"
    environment:
      - SECRET_KEY=${BUGSINK_SECRET_KEY:-}
      - CREATE_SUPERUSER=${BUGSINK_CREATE_SUPERUSER:-}
      - BASE_URL=${BUGSINK_BASE_URL:-http://localhost:8088}
      - PORT=8000
      - SINGLE_USER=True
      - USER_REGISTRATION=CB_NOBODY
      - PHONEHOME=False
      - MINIMIZE_INFORMATION_EXPOSURE=True
      - BEHIND_HTTPS_PROXY=${BUGSINK_BEHIND_HTTPS_PROXY:-False}
    volumes:
      - bugsink-data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://127.0.0.1:8000/health/ready', timeout=5).raise_for_status()",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  bugsink-data:
