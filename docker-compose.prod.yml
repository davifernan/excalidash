# Deployment without building on the server.
#
# These are THIS FORK's images, not upstream's. Upstream's images do not
# contain the snapshot compression, the password reset and invitation mails,
# the API-key agents or the editor's save-conflict merge, so pointing this file
# at them would quietly downgrade the instance.
#
#   cp .env.production.example .env
#   docker compose --env-file .env -f docker-compose.prod.yml pull
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# EXCALIDASH_IMAGE_TAG must be a verified release or sha-<commit> tag in .env.
# Compose refuses to start without it so an upgrade cannot silently move both
# images to `latest`. See FORK.md for the upgrade and rollback procedure.
# NIL-619: measured on the running production containers (26.08.2026, a quiet
# period) -- backend wrote ~8 KB/day of structured JSON (info/warn/error;
# per-request debug lines are off by default in production), frontend wrote
# ~500 KB/day, almost entirely nginx access-log lines from the container
# healthcheck polling /index.html every 30s, not real traffic. At `max-size:
# 10m, max-file: 3` (30 MB/container) that quiet-day backend rate alone would
# already outlast a week; the actual failure mode NIL-601 hit was a rare
# diagnostic warn firing once and being gone by the next rotation, not steady
# volume exceeding 30 MB. `max-file: 20` raises the cap to 200 MB/container --
# roughly 1000x the measured quiet-day backend rate per week, a deliberately
# large margin against days busier than this snapshot -- for a bounded cost of
# at most 800 MB across the four containers sharing this anchor when the
# observability profile is enabled, on a machine with 194 GB free disk.
# `compress: true` gzips every rotated (non-active)
# file; measured on the same snapshot, JSON log lines shrank ~3.4x and nginx's
# repetitive access-log lines ~11x, stretching the effective window further at
# zero extra memory (compression runs in dockerd's existing log-rotation path,
# not a new process). No separate collector (Loki/Vector) was considered
# further than that: this machine was already at 7.2/8 GB swap used during
# the same measurement window, so adding a memory-resident daemon next to
# production for a workload this small would trade a real, scarce resource
# for a benefit these numbers don't ask for.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "20"
    compress: "true"

services:
  backend:
    image: ghcr.io/davifernan/excalidash-backend:${EXCALIDASH_IMAGE_TAG:?set EXCALIDASH_IMAGE_TAG to a release or sha tag}
    container_name: excalidash-backend
    # A container without a memory limit can take the whole host with it. This
    # instance froze exactly that way: rendering a PDF spawned unbounded
    # Ghostscript processes, the machine ran out of RAM, started thrashing swap
    # and became unreachable — the container survived, the server did not.
    # memswap_limit equal to mem_limit means no swap at all for this container:
    # being killed is recoverable, dragging the host into swap is not.
    mem_limit: 1500m
    memswap_limit: 1500m
    environment:
      # PostgreSQL by default since 0.20.0. SQLite stays supported and is one
      # override away -- set both variables to the commented values below.
      #
      # MEASURED before this switch (same machine, same transaction shape):
      # concurrent writers on one board, SQLite vs PostgreSQL --
      #   4 writers: 4/4 in 41ms      vs 4/4
      #  12 writers: 3/12 in 5044ms   vs 12/12
      # SQLite has one writer; more waiting only moves the failure.
      #
      #   - DATABASE_PROVIDER=sqlite
      #   - DATABASE_URL=file:/app/prisma/dev.db
      #
      # An instance whose old SQLite file still holds data refuses to start
      # rather than come up looking empty. See EXCALIDASH_ALLOW_STRANDED_SQLITE.
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-postgresql}
      - DATABASE_URL=${DATABASE_URL:-postgresql://excalidash:${POSTGRES_PASSWORD:-excalidash}@postgres:5432/excalidash}
      - PORT=8000
      - NODE_ENV=production
      - AUTH_MODE=${AUTH_MODE:-local}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=false
      # Optional for single-instance deployments:
      # if unset, backend auto-generates and persists one in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - ERROR_TRACKER_DSN=${ERROR_TRACKER_DSN:-}
      # Public address of the instance. Used to build links in outgoing mail.
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      # How long a session survives when "remember me" was ticked.
      - JWT_REFRESH_EXPIRES_IN_REMEMBERED=${JWT_REFRESH_EXPIRES_IN_REMEMBERED:-30d}
      # --- Password reset and invitations by mail ----------------------
      # Without a transport the reset form is hidden rather than offered and
      # then silently failing.
      - ENABLE_PASSWORD_RESET=${ENABLE_PASSWORD_RESET:-false}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-none}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      # --- Keeping the database from growing without bound -------------
      - ENABLE_SNAPSHOT_COMPRESSION=${ENABLE_SNAPSHOT_COMPRESSION:-true}
      - SNAPSHOT_MAX_COUNT_PER_DRAWING=${SNAPSHOT_MAX_COUNT_PER_DRAWING:-100}
      - ENABLE_SNAPSHOT_VACUUM=${ENABLE_SNAPSHOT_VACUUM:-true}
      - IMPORT_MAX_SCENE_MEMORY_MB=${IMPORT_MAX_SCENE_MEMORY_MB:-64}
      - ASSET_RENDER_CONCURRENCY=${ASSET_RENDER_CONCURRENCY:-1}
      - ASSET_RENDER_QUEUE_LIMIT=${ASSET_RENDER_QUEUE_LIMIT:-32}
      - ASSET_PDF_SHRINK_CONCURRENCY=${ASSET_PDF_SHRINK_CONCURRENCY:-1}
      - ASSET_PDF_SHRINK_QUEUE_LIMIT=${ASSET_PDF_SHRINK_QUEUE_LIMIT:-2}
      # --- Daily full server backup with hard disk bounds --------------
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 0 3 * * *}
      - BACKUP_DIR=/app/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - BACKUP_MAX_COUNT=${BACKUP_MAX_COUNT:-7}
      - BACKUP_MAX_TOTAL_MB=${BACKUP_MAX_TOTAL_MB:-30720}
      - BACKUP_MIN_FREE_DISK_PERCENT=${BACKUP_MIN_FREE_DISK_PERCENT:-20}
      - BACKUP_MAX_AGE_HOURS=${BACKUP_MAX_AGE_HOURS:-48}
      - READINESS_CACHE_TTL_MS=${READINESS_CACHE_TTL_MS:-30000}
      # Optional OIDC settings (required for AUTH_MODE=hybrid or oidc_enforced)
      # - OIDC_PROVIDER_NAME=Authentik
      # - OIDC_ISSUER_URL=https://auth.example.com/application/o/excalidash/
      # - OIDC_CLIENT_ID=your-client-id
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_REDIRECT_URI=https://excalidash.example.com/api/auth/oidc/callback
    depends_on:
      postgres:
        # Waits for the database to answer, not merely to exist. Starting the
        # backend against a container that is still initialising produces a
        # connection error at boot, which reads like a misconfiguration.
        condition: service_healthy
    volumes:
      - backend-data:/app/prisma
      # Keep this bind-mounted directory in the off-site backup/snapshot job.
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Liveness only: readiness failures must not cause restart loops.
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/davifernan/excalidash-frontend:${EXCALIDASH_IMAGE_TAG:?set EXCALIDASH_IMAGE_TAG to a release or sha tag}
    container_name: excalidash-frontend
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "6767:80"
    environment:
      - BACKEND_URL=backend:8000
      - ERROR_TRACKER_DSN=${ERROR_TRACKER_DSN:-}
    depends_on:
      - backend
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17.11-alpine
    container_name: excalidash-postgres
    # Not behind a profile: this is the default database now, so it comes up
    # with `docker compose up` like the backend does. An instance that
    # overrides DATABASE_URL back to SQLite simply leaves this container idle.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-excalidash}
      - POSTGRES_USER=${POSTGRES_USER:-excalidash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-excalidash}
    volumes:
      - excalidash-postgres-data:/var/lib/postgresql/data
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-excalidash} -d ${POSTGRES_DB:-excalidash}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-postgres:
    image: postgres:17.11-alpine
    profiles: ["observability"]
    container_name: excalidash-glitchtip-postgres
    # NIL-626: the complete observability profile keeps Bugsink's former
    # 512 MiB ceiling. Fresh migrations peaked at 51.4 MiB here; a paced
    # 12-event backend run peaked at 63.3 MiB (26.08.2026).
    mem_limit: 192m
    memswap_limit: 192m
    environment:
      - POSTGRES_DB=${GLITCHTIP_DB_NAME:-glitchtip}
      - POSTGRES_USER=${GLITCHTIP_DB_USER:-glitchtip}
      - POSTGRES_PASSWORD=${GLITCHTIP_DB_PASSWORD:-}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    profiles: ["observability"]
    container_name: excalidash-glitchtip
    # Together with glitchtip-postgres this remains within the old 512 MiB
    # Bugsink budget. Fresh migrations peaked at 140.3 MiB; the paced event
    # run peaked at 172.6 MiB. Equal memswap_limit forbids host swap usage.
    mem_limit: 320m
    memswap_limit: 320m
    ports:
      - "${GLITCHTIP_PORT:-8088}:8000"
    environment:
      - DATABASE_URL=postgresql://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:-}@glitchtip-postgres:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      # An explicit empty value disables Valkey/Redis. GlitchTip then uses
      # Postgres for its task queue, cache and sessions.
      - VALKEY_URL=
      - SECRET_KEY=${GLITCHTIP_SECRET_KEY:-}
      - EMAIL_URL=${GLITCHTIP_EMAIL_URL:-consolemail://}
      - DEFAULT_FROM_EMAIL=${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      - GLITCHTIP_DOMAIN=${GLITCHTIP_DOMAIN:-http://localhost:8088}
      - ALLOWED_HOSTS=${GLITCHTIP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${GLITCHTIP_CSRF_TRUSTED_ORIGINS:-}
      - SERVER_ROLE=all_in_one
      - ENABLE_USER_REGISTRATION=False
      - ENABLE_ORGANIZATION_CREATION=False
      - GLITCHTIP_ENABLE_LOGS=False
      - GLITCHTIP_ENABLE_UPTIME=False
      - GLITCHTIP_ENABLE_MCP=False
      - GLITCHTIP_ENABLE_DUCKDB=False
      - VTASKS_CONCURRENCY=2
      - DATABASE_POOL_MAX_SIZE=5
      - GLITCHTIP_RETENTION_DAYS=${GLITCHTIP_RETENTION_DAYS:-90}
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - excalidash-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 20

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  excalidash-postgres-data:
  glitchtip-postgres-data:
  glitchtip-uploads:
