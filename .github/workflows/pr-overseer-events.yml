name: PR Overseer Events

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, closed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

jobs:
  signal:
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Normalize event
        id: event
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          payload=$(node scripts/delivery-contracts.cjs event)
          echo "payload=${payload}" >> "$GITHUB_OUTPUT"

      - name: Wake visible PR Overseer
        env:
          WEBHOOK: ${{ secrets.MULTICA_PR_OVERSEER_WEBHOOK }}
          PAYLOAD: ${{ steps.event.outputs.payload }}
        run: |
          set -euo pipefail

          skip=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).skip))' "${PAYLOAD}")
          if [ "${skip}" = "true" ]; then
            node scripts/pr-overseer-event-log.cjs
            exit 0
          fi

          if [ -z "${WEBHOOK}" ]; then
            echo "::notice::MULTICA_PR_OVERSEER_WEBHOOK is not configured yet; event remains recoverable through GitHub and NIL-384."
            exit 0
          fi

          body=$(node -e 'process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).event))' "${PAYLOAD}")
          key=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).idempotencyKey)' "${PAYLOAD}")
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "${WEBHOOK}" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${key}" \
            --max-time 30 --retry 2 --retry-connrefused \
            -d "${body}" || true)

          if [ -z "${code}" ] || [ "${code}" = "000" ]; then
            echo "::error::Could not reach the PR Overseer wake endpoint."
            exit 1
          fi
          case "${code}" in
            2*) echo "PR Overseer event accepted (HTTP ${code})." ;;
            *)  echo "::error::PR Overseer wake endpoint returned HTTP ${code}."; exit 1 ;;
          esac
