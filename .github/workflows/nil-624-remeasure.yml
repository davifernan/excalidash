name: NIL-624 Remeasure vs main

# Repeats the exact "measure-vs-main" methodology from PR #226's own
# NIL-686 matrix (branch chore/nil-686-lockfile-bisect, commit b06a5bf1),
# after NIL-702 landed on main (worker-based Markdown rendering). The
# original measurement (Chromium 87.9ms vs 21.5ms, WebKit 55.5ms vs 34.5ms,
# both p<0.001) was attributed to a synchronous render after `setPages`;
# NIL-702 fixed exactly that. This job answers whether the regression is
# gone now that main has the fix -- same test, same matrix shape (5
# alternating branch/main legs, both engines, one leg at a time), same
# env vars and ports, only the two checked-out refs are updated.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nil-624-remeasure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure-vs-main:
    name: vs-main-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: branch-1
            ref: 97b099cb0d7269d1bfd87ad28af2b11814d6f630
            side: branch
          - label: main-1
            ref: d8ae1c38ef794b92fdce331bfbbc0c0126f56475
            side: main
          - label: branch-2
            ref: 97b099cb0d7269d1bfd87ad28af2b11814d6f630
            side: branch
          - label: main-2
            ref: d8ae1c38ef794b92fdce331bfbbc0c0126f56475
            side: main
          - label: branch-3
            ref: 97b099cb0d7269d1bfd87ad28af2b11814d6f630
            side: branch
          - label: main-3
            ref: d8ae1c38ef794b92fdce331bfbbc0c0126f56475
            side: main
          - label: branch-4
            ref: 97b099cb0d7269d1bfd87ad28af2b11814d6f630
            side: branch
          - label: main-4
            ref: d8ae1c38ef794b92fdce331bfbbc0c0126f56475
            side: main
          - label: branch-5
            ref: 97b099cb0d7269d1bfd87ad28af2b11814d6f630
            side: branch
          - label: main-5
            ref: d8ae1c38ef794b92fdce331bfbbc0c0126f56475
            side: main

    steps:
      - name: Checkout the measured ref
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install from this ref's own lockfile
        # main predates NIL-636's root Workspace: no root package.json, two
        # standalone lockfiles instead. `npm ci` at the root only works on
        # the branch side; main needs each package installed separately, the
        # same way it always has.
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          if [ "$SIDE" = "main" ]; then
            npm ci --prefix backend
            npm ci --prefix frontend
          else
            npm ci
          fi

      - name: Install E2E dependencies and prepare the database
        run: |
          set -euo pipefail
          npm ci --prefix e2e
          cd backend
          npx prisma generate
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/nil-624-vsmain.db" \
            node scripts/provider-prisma.cjs migrate deploy

      - name: Install Chromium and WebKit
        run: cd e2e && npx playwright install chromium webkit --with-deps

      - name: Measure the 2 MiB two-context path on chromium and webkit
        env:
          SIDE: ${{ matrix.side }}
          REF: ${{ matrix.ref }}
        run: |
          set -uo pipefail
          {
            echo "side=$SIDE ref=$REF"
            echo "timestamp=$(date --utc --iso-8601=seconds)"
            echo "node=$(node --version) npm=$(npm --version)"
            uname -a
            nproc
            free -h
            cat /proc/loadavg
            df -h .
          } | tee nil-624-vsmain-measurement.log

          cd backend
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/nil-624-vsmain.db" \
            PORT=8687 \
            FRONTEND_URL="http://127.0.0.1:6687" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/nil-624-vsmain-assets" \
            npm run dev > ../nil-624-vsmain-backend.log 2>&1 &
          BACKEND_PID=$!
          FRONTEND_PID=""
          cleanup() {
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          cd ..

          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:8687/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8687/health >/dev/null

          cd frontend
          VITE_DEV_BACKEND_URL="http://127.0.0.1:8687" \
            npm run dev -- --host 127.0.0.1 --port 6687 > ../nil-624-vsmain-frontend.log 2>&1 &
          FRONTEND_PID=$!
          cd ..
          for attempt in {1..60}; do
            curl -fsS http://127.0.0.1:6687 >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6687 >/dev/null

          set +e
          cd e2e
          for engine in chromium webkit; do
            echo "=== engine=$engine ===" | tee -a ../nil-624-vsmain-measurement.log
            NO_SERVER=true CI=true BASE_URL=http://127.0.0.1:6687 API_URL=http://127.0.0.1:8687 PORT=8687 \
              timeout --signal=INT --kill-after=30s --preserve-status 300 \
              npx playwright test tests/document-pages.spec.ts --project="$engine" \
                -g "a collaborator stays responsive" 2>&1 | tee -a ../nil-624-vsmain-measurement.log
            echo "playwright_exit_${engine}=${PIPESTATUS[0]}" | tee -a ../nil-624-vsmain-measurement.log
          done
          cd ..
          set -e

      - name: Publish measurement evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nil-624-vsmain-${{ matrix.label }}
          path: |
            nil-624-vsmain-measurement.log
            nil-624-vsmain-backend.log
            nil-624-vsmain-frontend.log
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
