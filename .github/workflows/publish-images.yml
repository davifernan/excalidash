name: Publish Images

# Deployment pulls images rather than building on the server, so the machine
# that runs ExcaliDash never needs a checkout, a toolchain or build memory.
#
# Publishing is chained to the test run rather than to the push: an image that
# nobody can tell apart from a good one, built from a commit whose tests failed,
# is worse than no image at all.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A newer commit supersedes an older one. Cancelling here is safe because the
# tags are `latest` and the commit sha: whoever wins publishes the newest state,
# and a cancelled push leaves no half-written tag behind — a registry only
# accepts an image once its manifest arrives.
concurrency:
  group: publish-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the owner name is already lowercase.
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/excalidash

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skipped when the tests did not pass. workflow_dispatch has no test run
    # attached, so it is allowed through deliberately for a manual rebuild.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the commit that was tested
        uses: actions/checkout@v4
        with:
          # workflow_run fires against the default branch, so the sha has to be
          # taken from the run that triggered it — otherwise a rapid second push
          # would be published under the first one's name.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Collect build identity
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${SHA:0:7}"
          VERSION="$(tr -d '[:space:]' < VERSION || echo 0.0.0)"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Shown in Settings > Advanced. Carries the commit so the question
          # "which build is this instance running?" has an answer without
          # anyone having to log into the server.
          echo "build_label=production · $SHORT" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only linux/amd64: the target is an AMD EPYC machine. Building arm64 as
      # well would mean emulation on the runner and several times the wall
      # clock for an image nobody pulls.
      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          # The frontend build reads ../VERSION, so its context is the repo root.
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
            VITE_APP_BUILD_LABEL=${{ steps.meta.outputs.build_label }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Say what was published
        run: |
          {
            echo "### Images published"
            echo
            echo "Commit \`${{ steps.meta.outputs.short_sha }}\`, version ${{ steps.meta.outputs.version }}"
            echo
            echo '```'
            echo "${{ env.IMAGE_PREFIX }}-backend:sha-${{ steps.meta.outputs.short_sha }}"
            echo "${{ env.IMAGE_PREFIX }}-frontend:sha-${{ steps.meta.outputs.short_sha }}"
            echo '```'
            echo
            echo "Deploy with \`docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
