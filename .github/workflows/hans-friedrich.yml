# Asks Hans-Friedrich for a review when a pull request opens.
#
# The workflow itself does no reviewing. It pokes a Multica autopilot, which
# starts an agent on our own daemon; that agent reads the diff and posts the
# review as the-hans-friedrich[bot]. Keeping the work off the runner means the
# agent has the repository, the CLI, and the Multica issue tracker at hand —
# none of which a runner has.
#
# Admission is cheap and deterministic, so it runs again after pushes and body
# edits. The expensive review request remains one-shot on the ready transition.
# Finding fixes are checked by the narrow delta verifier, not by running Hans
# over the whole PR again. If initial admission failed, the pipeline sentinel
# requests the first review after the corrected head remains stable.
#
# The ready event types are needed. `opened` covers a pull request that starts ready;
# `ready_for_review` covers one that starts as a draft and is finished later —
# GitHub does not re-send `opened` for that transition, so the draft guard below
# would otherwise be the end of it.
name: Hans-Friedrich

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, edited, reopened]

permissions:
  contents: read

jobs:
  request-review:
    # Drafts are not finished work, and a bot's dependency bump is not worth an
    # agent. Both are cheap to rule out before a runner even starts.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff-derived impact manifest
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          manifest=$(node scripts/delivery-v2.cjs impact)
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Check review admission
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          IMPACT_MANIFEST: ${{ steps.impact.outputs.manifest }}
        run: node scripts/delivery-v2.cjs admission

      - name: Check commit identity and trailer
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/delivery-contracts.cjs commits

      - name: Ask Multica for a review
        if: >-
          github.event.action == 'opened' ||
          github.event.action == 'ready_for_review'
        env:
          # Repository secret. The token in the URL is the calling credential —
          # rotate it in Multica (Autopilot -> Trigger -> Rotate URL) and update
          # the secret if it ever leaks.
          WEBHOOK: ${{ secrets.MULTICA_REVIEW_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The real event, not a fixed "opened": Multica trigger filters can
          # match on it, and a draft finished later is not a pull request opened.
          ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # OWNER, MEMBER or COLLABORATOR — GitHub's own answer to "does this
          # person have write access here".
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          # Anyone outside the association check who should still get reviews.
          # Space-separated logins; empty is fine.
          EXTRA_TRUSTED: ""
        run: |
          set -euo pipefail

          # A `pull_request` run from a fork gets no repository secrets. Say
          # that, rather than letting the empty secret below report a missing
          # one and send the reader to the Secrets menu for nothing.
          if [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "::notice::Fork pull request (${HEAD_REPO}) — GitHub withholds secrets here, so no review was requested. Trigger the autopilot by hand if this one needs a look."
            exit 0
          fi

          # This repository is public, and a review costs real tokens. Only
          # people who can already write here get one automatically.
          #
          # On a public repo a same-repo pull request implies write access
          # anyway, so this is a second lock on the same door — deliberately.
          # It keeps holding if someone later switches the trigger to
          # `pull_request_target`, which is exactly the change that would
          # quietly open the first one.
          trusted=false
          case "${ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR) trusted=true ;;
          esac
          for login in ${EXTRA_TRUSTED}; do
            [ "${login}" = "${AUTHOR}" ] && trusted=true
          done

          if [ "${trusted}" != "true" ]; then
            echo "::notice::${AUTHOR} is ${ASSOCIATION} — no automatic review. Add the login to EXTRA_TRUSTED in this workflow, or fire the autopilot by hand."
            exit 0
          fi

          if [ -z "${WEBHOOK}" ]; then
            echo "::error::MULTICA_REVIEW_WEBHOOK is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi

          # Keyed on the head commit, so a retried delivery cannot start a
          # second review of the same code.
          body=$(printf '{"event":"pull_request","action":"%s","repo":"%s","pr":%s,"head_sha":"%s"}' "$ACTION" "$REPO" "$PR" "$HEAD_SHA")

          # `|| true` on purpose: under `set -e` a transport failure would kill
          # the step before it could say what went wrong. Catch it, report it.
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${REPO}#${PR}@${HEAD_SHA}" \
            --max-time 30 --retry 2 --retry-connrefused \
            -d "$body" || true)

          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Could not reach Multica at all — is agents.nilo.live up?"
            exit 1
          fi

          status=$(python3 -c 'import json,sys;print(json.load(open("response.json")).get("status","?"))' 2>/dev/null || echo '?')
          echo "HTTP ${code}, status ${status}"

          case "$code" in
            2*) ;;
            *)  echo "::error::Multica refused the trigger (HTTP ${code})"; cat response.json; exit 1 ;;
          esac

          # Multica answers 200 for business-level refusals too, so read the
          # status rather than trusting the code. None of these is a failure of
          # this workflow — say so and finish green.
          case "$status" in
            accepted)  echo "Review started." ;;
            duplicate) echo "::notice::Already reviewed at this commit." ;;
            skipped)   echo "::warning::Multica skipped the run — the agent runtime is probably offline." ;;
            ignored)   echo "::warning::Multica ignored the trigger — autopilot paused, or the event was filtered." ;;
            *)         echo "::warning::Unexpected status '${status}'." ;;
          esac
