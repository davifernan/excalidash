# Asks Hans-Friedrich for a review when a pull request opens.
#
# The workflow itself does no reviewing. It pokes a Multica autopilot, which
# starts an agent on our own daemon; that agent reads the diff and posts the
# review as the-hans-friedrich[bot]. Keeping the work off the runner means the
# agent has the repository, the CLI, and the Multica issue tracker at hand —
# none of which a runner has.
#
# A runner now also explains an intentional no-review outcome, but Hans itself
# is asked only when a pull request becomes ready, not on every push: a review
# per force-push costs tokens and repeats itself. Finding fixes are checked by
# the narrow delta verifier, not by running Hans over the whole PR again.
#
# Both event types are needed. `opened` covers a pull request that starts ready;
# `ready_for_review` covers one that starts as a draft and is finished later —
# GitHub does not re-send `opened` for that transition.
name: Hans-Friedrich

on:
  pull_request:
    # `edited` (NIL-585): eine Body-Korrektur loest die Zulassung selbst aus.
    # Vorher war der einzige Weg `gh pr ready --undo && gh pr ready` -- ein
    # undokumentierter Umweg, den ein Agent nicht kennt und der am 25.08.2026
    # drei fertige PRs je ~55 Minuten aufgehalten hat.
    types: [opened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

# A rerun waits for the previous signal attempt on the same head. The PR
# comment also carries a head/kind marker, so a retry cannot post it twice.
concurrency:
  group: hans-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify review intent
        id: intent
        uses: ./.github/actions/hans-review-intent

      - name: Build diff-derived impact manifest
        if: steps.intent.outputs.action == 'admit'
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          manifest=$(node scripts/delivery-v2.cjs impact)
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Check review admission
        if: steps.intent.outputs.action == 'admit'
        id: admission
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          IMPACT_MANIFEST: ${{ steps.impact.outputs.manifest }}
        run: |
          set +e
          result=$(node scripts/delivery-v2.cjs admission 2>&1)
          status=$?
          set -e
          echo "$result"
          delimiter="ADMISSION_RESULT_$(openssl rand -hex 16)"
          {
            echo "result<<$delimiter"
            printf '%s\n' "$result"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Explain review outcome on the PR
        if: steps.intent.outputs.action == 'skip' || steps.admission.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DECISION: ${{ steps.intent.outputs.decision }}
          ADMISSION_RESULT: ${{ steps.admission.outputs.result }}
        with:
          script: |
            const signal = require(`${process.env.GITHUB_WORKSPACE}/scripts/hans-review-signal.cjs`);
            const decision = JSON.parse(process.env.DECISION);
            let admission = null;
            let kind = "intentional-skip";
            if (decision.action !== "skip") {
              kind = "delivery-contract";
              try {
                admission = JSON.parse(process.env.ADMISSION_RESULT);
              } catch {
                admission = {
                  ok: false,
                  code: "admission-command",
                  message: process.env.ADMISSION_RESULT || "Review admission failed without output.",
                };
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (signal.hasSignalComment(comments, process.env.HEAD_SHA, kind)) {
              core.notice("The review-outcome comment already exists for this head SHA.");
              return;
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: signal.buildSignalComment({
                  headSha: process.env.HEAD_SHA,
                  decision,
                  admission,
                }),
              });
            } catch (error) {
              // A fork's pull_request token is read-only. Its matching
              // pull_request_target signal run uses trusted base code and owns
              // the write; every other comment failure remains a real failure.
              if (decision.action === "skip" && error.status === 403) {
                core.notice("Fork token is read-only; the trusted signal workflow will post this explanation.");
                return;
              }
              throw error;
            }

      - name: Enforce review admission
        if: always()
        env:
          INTENT_ACTION: ${{ steps.intent.outputs.action }}
          ADMISSION_OUTCOME: ${{ steps.admission.outcome }}
        run: |
          jq -cn \
            --arg intentAction "${INTENT_ACTION}" \
            --arg admissionOutcome "${ADMISSION_OUTCOME}" \
            '{intentAction:$intentAction,admissionOutcome:$admissionOutcome}' \
            | node scripts/hans-review-signal.cjs enforce

      - name: Check commit identity and trailer
        if: steps.admission.outcome == 'success'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/delivery-contracts.cjs commits

      # `edited` runs the admission check for fast feedback but must never
      # summon Hans (NIL-585): there is no guard against a second review of the
      # same head, so a body edit after a completed review would produce one --
      # exactly what AGENTS.md's one-shot contract forbids. Only
      # `opened`/`ready_for_review` actually ask for a review.
      - name: Ask Multica for a review
        if: steps.admission.outcome == 'success' && github.event.action != 'edited'
        env:
          # Repository secret. The token in the URL is the calling credential —
          # rotate it in Multica (Autopilot -> Trigger -> Rotate URL) and update
          # the secret if it ever leaks.
          WEBHOOK: ${{ secrets.MULTICA_REVIEW_WEBHOOK }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The real event, not a fixed "opened": Multica trigger filters can
          # match on it, and a draft finished later is not a pull request opened.
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK}" ]; then
            echo "::error::MULTICA_REVIEW_WEBHOOK is not set. Add it under Settings -> Secrets -> Actions."
            exit 1
          fi

          # Keyed on the head commit, so a retried delivery cannot start a
          # second review of the same code.
          body=$(printf '{"event":"pull_request","action":"%s","repo":"%s","pr":%s,"head_sha":"%s"}' "$ACTION" "$REPO" "$PR" "$HEAD_SHA")

          # `|| true` on purpose: under `set -e` a transport failure would kill
          # the step before it could say what went wrong. Catch it, report it.
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: ${REPO}#${PR}@${HEAD_SHA}" \
            --max-time 30 --retry 2 --retry-connrefused \
            -d "$body" || true)

          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Could not reach Multica at all — is agents.nilo.live up?"
            exit 1
          fi

          status=$(python3 -c 'import json,sys;print(json.load(open("response.json")).get("status","?"))' 2>/dev/null || echo '?')
          echo "HTTP ${code}, status ${status}"

          case "$code" in
            2*) ;;
            *)  echo "::error::Multica refused the trigger (HTTP ${code})"; cat response.json; exit 1 ;;
          esac

          # Multica answers 200 for business-level refusals too, so read the
          # status rather than trusting the code. None of these is a failure of
          # this workflow — say so and finish green.
          case "$status" in
            accepted)  echo "Review started." ;;
            duplicate) echo "::notice::Already reviewed at this commit." ;;
            skipped)   echo "::warning::Multica skipped the run — the agent runtime is probably offline." ;;
            ignored)   echo "::warning::Multica ignored the trigger — autopilot paused, or the event was filtered." ;;
            *)         echo "::warning::Unexpected status '${status}'." ;;
          esac
