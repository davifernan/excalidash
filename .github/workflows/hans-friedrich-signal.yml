# Comments on intentional no-review outcomes without exposing secrets or
# executing pull-request code. `pull_request_target` is required here because
# GitHub downgrades the token of a fork's `pull_request` workflow to read-only.
# The checkout is pinned to the trusted base SHA; never change it to the head.
name: Hans-Friedrich Signal

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# Keep this expression identical to hans-friedrich.yml. Both workflows can
# write the same intentional-skip comment, so they must serialize the
# read-then-write check for one PR state and head. The draft/ready partition
# is deliberate: a ready admission must not queue behind a draft skip.
concurrency:
  group: hans-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: false

jobs:
  explain-intentional-no-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Classify review intent
        id: intent
        uses: ./.github/actions/hans-review-intent

      - name: Explain intentional no-review on the PR
        if: steps.intent.outputs.action == 'skip'
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DECISION: ${{ steps.intent.outputs.decision }}
        with:
          script: |
            const signal = require(`${process.env.GITHUB_WORKSPACE}/scripts/hans-review-signal.cjs`);
            const decision = JSON.parse(process.env.DECISION);
            const kind = "intentional-skip";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (signal.hasSignalComment(comments, process.env.HEAD_SHA, kind)) {
              core.notice("The intentional no-review comment already exists for this head SHA.");
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: signal.buildSignalComment({ headSha: process.env.HEAD_SHA, decision }),
            });
