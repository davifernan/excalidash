name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing three commits in a row used to start three full runs side by side,
# each taking several minutes. Only the newest state is worth testing, and the
# image publish is chained to this run, so superseding an in-flight run also
# stops an image nobody would deploy from being built.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-contracts:
    name: Delivery Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/*.test.cjs
      - run: node scripts/delivery-routing-probe.cjs
      # Named explicitly rather than left to the counterprobe, same reasoning
      # as adapter-boundary.cjs in frontend-typecheck: `node --test
      # scripts/*.test.cjs` above does pick real-auth-boundary.test.cjs up,
      # but that is a glob happening to match a filename, and a rule that
      # holds by accident stops holding the moment somebody renames a file.
      - name: Check the real-auth E2E spec isolation list
        run: node scripts/real-auth-boundary.cjs

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      # Deliberately inside an already-required context rather than a new job.
      # A new check would not be in the branch ruleset, so it could go red
      # without blocking anything -- and a gate nobody has to pass teaches
      # people to walk past red.
      #
      # Named explicitly rather than left to the counterprobe: `node --test
      # scripts/*.test.cjs` in Delivery Contract Tests does pick the probe up and
      # its first assertion runs the scan, so the boundary is guarded either way.
      # But that is a glob happening to match a filename, and a rule that holds
      # by accident stops holding the moment somebody renames a file.
      - name: Check the Excalidraw adapter boundary
        run: node scripts/adapter-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/adapter-boundary.test.cjs

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Typecheck backend
        run: npm run typecheck --prefix backend

  authz-boundary:
    name: Authz Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependency install: the check reads backend/src with node:fs and
      # nothing else. That is deliberate -- a boundary check that needs a
      # package tree can only run where one was installed, and this one has to
      # be cheap enough to keep as its own required gate.
      - name: Check the board-ownership boundary
        run: node scripts/authz-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/authz-boundary.test.cjs

  agent-token-boundary:
    name: Agent Token Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependency install, same reasoning as Authz Boundary: this reads
      # backend/src with node:fs and nothing else.
      - name: Check the agent-token centralization (NIL-382)
        run: node scripts/agent-token-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/agent-token-boundary.test.cjs

  type-collision-inventory:
    name: Type Collision Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No dependency install, same reasoning as Authz Boundary: this reads
      # frontend/src and backend/src with node:fs and nothing else.
      - name: Check the string-union type inventory (NIL-489)
        run: node scripts/type-collision-inventory.cjs

      - name: Prove the inventory rejects what it claims to
        run: node scripts/type-collision-inventory.test.cjs

  frontend-format:
    name: Frontend Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend formatting
        run: npm run format:check --prefix frontend

  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A dedicated job, not a step inside backend-tests (NIL-503): format:check
    # used to run as that job's first step under `bash -e`, so a formatting
    # issue aborted the job before `npm test` ever ran -- the job still
    # reported red as "Backend Tests", which reads as a test failure and
    # sends whoever is looking straight at the wrong thing. Three packages
    # hit exactly that reading in one day (NIL-501, NIL-502, NIL-503) before
    # anyone noticed the job that failed had never run a test. Splitting it
    # out the same way frontend-format already is means a formatting issue
    # says "Backend Format failed", nothing else, and backend-tests keeps
    # running even when it does.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend formatting
        run: npm run format:check --prefix backend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NIL-494: real Postgres coverage for migration SQL that an in-process
    # emulator cannot faithfully run (the NIL-326 migration's `DO $$ ...
    # EXCEPTION ... END $$` backfill block -- see
    # backend/src/__tests__/migrations/nil326SearchTextBackfill.postgres.test.ts).
    # Deliberately inside this already-required job rather than a new one:
    # a new job would not be in the branch ruleset, so it could go red
    # without blocking anything (see the same reasoning on
    # `frontend-typecheck`'s adapter-boundary check above). The logging
    # boundary (NIL-411/NIL-502) lives here for the identical reason.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excalidash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The same decoders the container image carries. Tests that exercise them
      # skip themselves when the binary is missing, so without this a broken
      # decoder invocation passes as a green run.
      - name: Install document and image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils ghostscript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Check the backend logging boundary
        run: node scripts/logging-boundary.cjs

      - name: Prove the logging boundary check rejects what it claims to
        run: node scripts/logging-boundary.test.cjs


      - name: Run backend tests
        run: |
          cd backend
          npm test
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/excalidash_test

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install package dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Check backend dead code
        run: npm run check:dead-code --prefix backend

      - name: Check frontend dead code
        run: npm run check:dead-code --prefix frontend

      - name: Prove dead-code detection in both directions
        run: node scripts/dead-code-counterprobe.cjs

  # Split across two runners rather than more workers. The suite deliberately
  # runs with workers: 1 because it shares one backend SQLite database and
  # cleans up by naming convention, so concurrency inside a job leaks between
  # tests. A separate job does not: it brings its own checkout, its own
  # database and its own servers.
  e2e-shards:
    name: E2E Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red shard must not cut the other one short — both results are
      # wanted, otherwise a failure hides whatever the other half would say.
      fail-fast: false
      matrix:
        shard: [1, 2]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
      
      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-test.db
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install chromium --with-deps
      
      - name: Start servers and run E2E tests
        run: |
          # Start backend server in background
          cd backend
          # The suite issues far more than the default 60 CSRF requests, so
          # without raising the limits it locks itself out with HTTP 429.
          # Uploaded documents default to the path they live at inside the
          # container, which nothing outside it may create, so tests that add a
          # document need somewhere in the workspace to put it.
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-test.db" \
            FRONTEND_URL="http://localhost:6767" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-assets" \
            npm run dev &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for backend to be ready
          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          # Start frontend server in background
          cd frontend
          npm run dev -- --host &
          FRONTEND_PID=$!
          cd ..

          # Wait for frontend to be ready
          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6767 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # 720s leaves several minutes of headroom under the job's 20-minute
          # ceiling for install/setup and this upload step.
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true timeout --signal=INT --kill-after=30s --preserve-status 720 \
            npx playwright test --project=chromium --shard=${{ matrix.shard }}/2 \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-test.db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
          # Today's default (`warn`) prints a warning line that reads exactly
          # like a normal "nothing failed" run and is easy to miss in a wall
          # of red. `error` turns "the report itself never got produced" into
          # its own failed, visible step instead of a swallowed footnote.
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error


  # The other engines, in their own job rather than as more projects in the
  # shards. Same reasoning the shards are built on: one backend and one SQLite
  # file cannot take the same specs running four times over with the same board
  # names. Measured the hard way -- each project passed alone, and all four in
  # one job did not finish in an hour.
  #
  # Not sharded: firefox and webkit carry a small subset each, so a second
  # runner would cost more in setup than it saves.
  e2e-cross-engine:
    name: E2E Cross-Engine Tests
    runs-on: ubuntu-latest
    # The same bound as a shard. It carries roughly as many tests -- about
    # seventy across three engines -- plus the install of two more browsers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
      
      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-cross.db
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci
      
      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install firefox webkit chromium --with-deps
      
      - name: Start servers and run E2E tests
        run: |
          # Start backend server in background
          cd backend
          # The suite issues far more than the default 60 CSRF requests, so
          # without raising the limits it locks itself out with HTTP 429.
          # Uploaded documents default to the path they live at inside the
          # container, which nothing outside it may create, so tests that add a
          # document need somewhere in the workspace to put it.
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-cross.db" \
            FRONTEND_URL="http://localhost:6767" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-cross-assets" \
            npm run dev &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for backend to be ready
          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          # Start frontend server in background
          cd frontend
          npm run dev -- --host &
          FRONTEND_PID=$!
          cd ..

          # Wait for frontend to be ready
          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6767 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # 720s leaves several minutes of headroom under the job's 20-minute
          # ceiling for install/setup and this upload step.
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true timeout --signal=INT --kill-after=30s --preserve-status 720 \
            npx playwright test --project=firefox --project=webkit --project=mobile-chrome \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-cross.db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-cross-engine
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-cross-engine
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error


  # comments-two-account.spec.ts (NIL-356) toggles real auth on for whatever
  # backend it runs against, which every other spec's no-auth "bootstrap
  # identity" mode depends on staying off (see playwright.config.ts's
  # REAL_AUTH_SPECS and the spec's own header comment). Running it inside
  # e2e-shards against that shared backend broke every other spec drawn into
  # the same shard the moment it ran -- a real incident, not a hypothetical:
  # 401s from `readLatestBootstrapSetupCode` failing (no E2E_BACKEND_LOG_FILE
  # on the shared backend) after the toggle already went through, with no
  # session left able to turn it back off. Its own backend, database, and
  # ports here, same as e2e-cross-engine, so nothing else can share the
  # blast radius.
  e2e-two-account:
    name: E2E Two-Account (NIL-356)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-two-account.db

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install chromium --with-deps

      - name: Start servers and run E2E tests
        run: |
          # Own ports so this never collides with a shard's or the
          # cross-engine job's 8000/6767 if runners ever share a host.
          BACKEND_LOG="${{ github.workspace }}/backend-two-account.log"

          cd backend
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-two-account.db" \
            PORT=8842 \
            FRONTEND_URL="http://localhost:6842" \
            CSRF_SECRET="e2e-two-account-csrf" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-two-account-assets" \
            npm run dev > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8842/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          cd frontend
          VITE_DEV_BACKEND_URL="http://localhost:8842" npm run dev -- --host --port 6842 &
          FRONTEND_PID=$!
          cd ..

          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6842 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true \
            API_URL="http://localhost:8842" \
            BASE_URL="http://localhost:6842" \
            E2E_BACKEND_LOG_FILE="$BACKEND_LOG" \
            timeout --signal=INT --kill-after=30s --preserve-status 720 \
            npx playwright test --project=two-account \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-two-account
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-two-account
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error

  # discovery-permission-matrix.spec.ts (NIL-326) toggles real auth on the
  # same way comments-two-account.spec.ts does, for the same reason it needs
  # its own job here rather than running inside e2e-shards -- and this is not
  # a hypothetical either: it broke every spec sharing its shard the first
  # time it ran (45 unrelated failures, all "401 Authentication token
  # required"), the exact e2e-two-account incident above repeating itself
  # because that spec's isolation is hand-maintained, not derived (see
  # scripts/real-auth-boundary.cjs, added the same time as this job, so a
  # third spec doing this gets caught at write time instead). Deliberately
  # its own job and its own ports/database rather than sharing
  # e2e-two-account's: two real-auth specs racing the same backend's
  # bootstrap-admin registration concurrently would be exactly the kind of
  # cross-spec interference this isolation exists to rule out.
  e2e-permission-matrix:
    name: E2E Permission Matrix (NIL-326)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-permission-matrix.db

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx playwright install chromium --with-deps

      - name: Start servers and run E2E tests
        run: |
          # Own ports so this never collides with a shard's, the cross-engine
          # job's, or e2e-two-account's if runners ever share a host.
          BACKEND_LOG="${{ github.workspace }}/backend-permission-matrix.log"

          cd backend
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-permission-matrix.db" \
            PORT=8853 \
            FRONTEND_URL="http://localhost:6853" \
            CSRF_SECRET="e2e-permission-matrix-csrf" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-permission-matrix-assets" \
            npm run dev > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8853/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          cd frontend
          VITE_DEV_BACKEND_URL="http://localhost:8853" npm run dev -- --host --port 6853 &
          FRONTEND_PID=$!
          cd ..

          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6853 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true \
            API_URL="http://localhost:8853" \
            BASE_URL="http://localhost:6853" \
            E2E_BACKEND_LOG_FILE="$BACKEND_LOG" \
            timeout --signal=INT --kill-after=30s --preserve-status 720 \
            npx playwright test --project=permission-matrix \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-permission-matrix
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-permission-matrix
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error

  # Carries the name the branch ruleset requires. The shards run under their
  # own names, so without this the required context 'E2E Browser Tests' would
  # never report again and every pull request would block forever.
  #
  # always() matters: a skipped gate never reports either, so it has to run
  # even when a shard failed, and decide from the results.
  #
  # team-acceptance.spec.ts is deliberately not in this list: it runs from
  # team-acceptance.yml on a nightly schedule. See that file for why.
  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-shards, e2e-two-account, e2e-permission-matrix]
    if: always()

    steps:
      - name: Require every shard and the isolated suites to have passed
        run: |
          shards="${{ needs.e2e-shards.result }}"
          two_account="${{ needs.e2e-two-account.result }}"
          permission_matrix="${{ needs.e2e-permission-matrix.result }}"
          echo "Shard results: ${shards}"
          echo "Two-account result: ${two_account}"
          echo "Permission-matrix result: ${permission_matrix}"
          if [ "${shards}" != "success" ] || [ "${two_account}" != "success" ] || [ "${permission_matrix}" != "success" ]; then
            echo "At least one E2E shard or an isolated suite did not pass."
            exit 1
          fi

  # Security tests for data sanitization
  security-tests:
    name: Security Sanitization Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate
      
      - name: Run security tests
        run: |
          cd backend
          npx ts-node src/securityTest.ts
