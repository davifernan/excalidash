  # NIL-649: every job above tests `npm run dev`, the Vite dev server -- never
  # what production actually serves (`npm run build` output behind nginx,
  # frontend/Dockerfile). That gap let comment-writing ship broken in the real
  # 0.13 image (NIL-644) while `comments-two-account.spec.ts` stayed green
  # here, and let the frontend image go unbuildable for two days (NIL-643)
  # with no CI signal either way, since nothing here ever built it.
  #
  # Deliberately a small fixed flow, not the whole suite run a second time:
  # see built-image-smoke.spec.ts's own header for what it covers and why.
  # Doubling 15+ minutes of E2E onto every PR for a second full pass would
  # buy repetition, not a different error class -- this exists to catch what
  # only differs between dev server and built bundle (minification,
  # tree-shaking, `import.meta.env` branches, build-time asset copying, the
  # nginx `/api/` rewrite), which one real flow through the built artifact
  # already exercises.
  #
  # Not yet in ops/repository-rules.sh's required_status_checks -- same
  # ordering as Env Boundary and CORS Header Boundary above: a brand new job
  # name is never made a required check before it has run green on main at
  # least once. NIL-666 tracks adding it once that has happened.
  e2e-built-image-smoke:
    name: E2E Built Image Smoke (NIL-649)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the frontend and backend images
        # Same images `docker-compose.prod.yml` runs in production, with
        # exactly one difference: the frontend is built with
        # VITE_E2E_HARNESS_ENABLED=true, so window.__EXCALIDASH_TEST__
        # exists for Playwright to drive the board through (see Editor.tsx's
        # harness effect). A real published image never sets that build arg.
        #
        # docker-compose.e2e-smoke.yml is a standalone file, not layered
        # onto docker-compose.yml with `-f` -- see its own header comment
        # for why (a review finding on this ticket's own PR: Compose merges
        # `ports` across `-f` files by concatenating them rather than
        # replacing them, and both docker-compose.yml and
        # docker-compose.prod.yml hard-code the same container names).
        run: |
          docker compose -f docker-compose.e2e-smoke.yml build backend frontend

      - name: Start the built image
        run: |
          docker compose -f docker-compose.e2e-smoke.yml up -d backend frontend

      - name: Wait for the built image to answer
        run: |
          echo "Waiting for the built frontend/backend..."
          for i in {1..60}; do
            # `-f`, not just `-s`: nginx answers immediately once it's up,
            # with a 502 for as long as the backend behind it is still
            # migrating/generating its Prisma client. Plain `curl -s`
            # returns exit 0 for that 502 too (curl only fails on a
            # transport error, not an HTTP error status), so without `-f`
            # this loop broke on attempt 1 every time -- caught in CI on
            # NIL-649's own PR (run 33195824353): "Built image is ready!"
            # printed immediately, then the strict check right after it
            # failed because the backend genuinely wasn't ready yet.
            if curl -sf http://localhost:16767/api/health > /dev/null; then
              echo "Built image is ready!"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 2
          done
          curl -sf http://localhost:16767/api/health > /dev/null || {
            echo "Built image never became ready. Backend log:"
            docker compose -f docker-compose.e2e-smoke.yml logs backend
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx --no-install playwright install chromium --with-deps

      - name: Run the built-image smoke spec
        run: |
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true \
            API_URL="http://localhost:16767/api" \
            BASE_URL="http://localhost:16767" \
            timeout --signal=INT --kill-after=30s --preserve-status 300 \
            npx --no-install playwright test --project=built-image \
            || TEST_EXIT_CODE=$?
          exit "$TEST_EXIT_CODE"

      - name: Container logs (always, for diagnosis)
        if: always()
        run: |
          docker compose -f docker-compose.e2e-smoke.yml logs

      - name: Tear down the built image
        if: always()
        run: |
          docker compose -f docker-compose.e2e-smoke.yml down -v

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-built-image-smoke
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-built-image-smoke
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error

  # Carries the name the branch ruleset requires. The shards run under their
  # own names, so without this the required context 'E2E Browser Tests' would
  # never report again and every pull request would block forever.
  #
  # always() matters: a skipped gate never reports either, so it has to run
  # even when a shard failed, and decide from the results.
  #
  # team-acceptance.spec.ts is deliberately not in this list: it runs from
  # team-acceptance.yml on a nightly schedule. See that file for why.
  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-shards, e2e-two-account, e2e-permission-matrix, e2e-presence-two-account]
    if: always()

    steps:
      - name: Require every shard and the isolated suites to have passed
        run: |
          shards="${{ needs.e2e-shards.result }}"
          two_account="${{ needs.e2e-two-account.result }}"
          permission_matrix="${{ needs.e2e-permission-matrix.result }}"
          presence_two_account="${{ needs.e2e-presence-two-account.result }}"
          echo "Shard results: ${shards}"
          echo "Two-account result: ${two_account}"
          echo "Permission-matrix result: ${permission_matrix}"
          echo "Presence two-account result: ${presence_two_account}"
          if [ "${shards}" != "success" ] || [ "${two_account}" != "success" ] || [ "${permission_matrix}" != "success" ] || [ "${presence_two_account}" != "success" ]; then
            echo "At least one E2E shard or an isolated suite did not pass."
            exit 1
          fi

  # Security tests for data sanitization
  security-tests:
    name: Security Sanitization Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install backend dependencies
        run: |
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx --no-install prisma generate

      - name: Run security tests
        run: |
          cd backend
          npx --no-install ts-node src/securityTest.ts

  # NIL-667: nginx only inherits a parent block's `add_header` directives when
  # the current `location` has none of its own -- add even one, and every
  # server-level security header (X-Frame-Options, X-Content-Type-Options,
  # Referrer-Policy, Permissions-Policy, Content-Security-Policy) silently
  # stops applying to it. frontend/nginx.conf.template's server block set all
  # five "always", but three location blocks each added their own
  # Cache-Control/Referrer-Policy and dropped the rest -- invisible against
  # the Vite dev server, which sends no nginx headers at all, and only
  # checkable against what nginx actually sends, never against the config
  # file as text (that's why this builds and runs the real image rather than
  # parsing nginx.conf.template).
  #
  # Deliberately its own job rather than folding into NIL-649's "E2E Built
  # Image Smoke" job (still on its own PR, #229, as of this job's addition):
  # every header this checks comes from nginx serving static files directly,
  # never through the /api/ or /socket.io/ proxy_pass paths, so this needs
  # only the frontend image -- no backend, no Playwright browser, no E2E
  # harness build flag. That makes a plain `docker build` + `curl` faster and
  # simpler than standing up the full compose stack a browser-driven flow
  # needs, and this job has nothing to gain from being harnessed for a
  # browser once NIL-649 lands: an independent curl-based check on the same
  # image family is arguably more convincing evidence than a shared spec
  # file would be, precisely because it does not need whatever
  # `built-image-smoke.spec.ts` sets up for entirely different reasons.
  #
  # Not yet in ops/repository-rules.sh's required_status_checks -- same
  # ordering as Env Boundary and CORS Header Boundary: a brand new job name
  # is never made a required check before it has run green on main at least
  # once.
  nginx-security-headers:
    name: Nginx Security Headers (NIL-667)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the frontend image
        run: docker build -f frontend/Dockerfile -t excalidash-frontend-nil667 .

      - name: Start the built frontend image
        # Own host port (16768), never 6767 (production) or a port another CI
        # job might also be using. No backend container exists here -- nginx
        # still validates its config at startup, and a plain hostname
        # (the container default "backend:8000") fails DNS resolution with
        # no compose network to resolve it in ("host not found in upstream
        # \"backend\""), so BACKEND_URL is an IP:port instead. nginx never
        # needs it to actually answer: nothing this job checks reaches the
        # /api/ or /socket.io/ proxy_pass paths.
        run: docker run -d --name excalidash-frontend-nil667 -p 16768:80 -e BACKEND_URL=127.0.0.1:1 excalidash-frontend-nil667

      - name: Wait for nginx to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:16768/index.html > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 1
          done
          curl -sf http://localhost:16768/index.html > /dev/null || {
            echo "Frontend never became ready. Container logs:"
            docker logs excalidash-frontend-nil667
            exit 1
          }

      - name: Check security headers on the running image
        run: scripts/check-nginx-security-headers.sh http://localhost:16768

      - name: Container logs (always, for diagnosis)
        if: always()
        run: docker logs excalidash-frontend-nil667

      - name: Tear down
        if: always()
        run: docker rm -f excalidash-frontend-nil667
