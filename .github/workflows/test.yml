name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing three commits in a row used to start three full runs side by side,
# each taking several minutes. Only the newest state is worth testing, and the
# image publish is chained to this run, so superseding an in-flight run also
# stops an image nobody would deploy from being built.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery-contracts:
    name: Delivery Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # release-tag-guard.cjs (NIL-507) needs full history and tags to
          # check whether a bare v<VERSION> tag exists and is our ancestor --
          # a shallow, tag-less clone would make every existence check false
          # and the guard would pass for the wrong reason.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install delivery contract dependencies
        run: npm ci
      - run: node --test scripts/*.test.cjs
      - run: node scripts/delivery-routing-probe.cjs
      # Named explicitly rather than left to the counterprobe, same reasoning
      # as adapter-boundary.cjs in frontend-typecheck: `node --test
      # scripts/*.test.cjs` above does pick real-auth-boundary.test.cjs up,
      # but that is a glob happening to match a filename, and a rule that
      # holds by accident stops holding the moment somebody renames a file.
      - name: Check the real-auth E2E spec isolation list
        run: node scripts/real-auth-boundary.cjs
      - name: Check release tag and changelog delivery guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-guard.cjs
      - name: Prove the release tag guard rejects what it claims to
        run: node scripts/release-tag-guard.test.cjs
      # A deleted file cannot fail a test that no longer runs it. Check only
      # pull requests, where GitHub provides both the PR body and its base/head
      # commits; the guard itself uses their merge-base so an out-of-date branch
      # never inherits a deletion made later on main.
      - name: Check declared PR file deletions
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-deletion-guard.cjs
      # Docker context vs. Dockerfile COPY sources: root-Workspace COPYs in
      # backend/Dockerfile silently broke six build call sites still passing
      # the pre-Workspace `context: ./backend` (two of them release-tag build
      # steps -- discovered only by review, not by this job, since every
      # Docker build this job itself runs already used the correct context;
      # NIL-636).
      - name: Check Docker build contexts against their Dockerfile's COPY sources
        run: node scripts/docker-build-context-guard.cjs
      # A workflow whose local install is missing or broken must fail loudly
      # at that point, not have `npx` silently fetch an arbitrary version
      # from the registry and run that instead: `_soak-part.yml` did exactly
      # that after NIL-636's root-Workspace restructuring left it running
      # `cd backend && npm ci` against a lockfile that no longer exists
      # there, and the resulting `npx prisma generate` quietly downloaded a
      # `-rc` prerelease with a different CLI instead of failing on the
      # missing install (NIL-636 soak incident).
      - name: Check every workflow npx call carries --no-install
        run: node scripts/npx-no-install-guard.cjs
      - name: Prove the npx --no-install guard rejects what it claims to
        run: node scripts/npx-no-install-guard.test.cjs
      # Runs against the real GitHub API (main's own tip and its real
      # check-runs), not a fixture -- Davi, PR #79: a test that only covers
      # the single-page case would stay green and prove nothing, since the
      # bug it guards only appears once a commit's check-runs genuinely span
      # more than one page.
      - name: Prove release-check-runs.sh merges real multi-page results correctly
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-check-runs.test.sh

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      # JSON.parse and JS configuration both silently keep the final duplicate
      # key. Keep this inside the existing frontend dependency context: it is
      # a required check without adding another job or any green-path output.
      - name: Check configuration keys are unique
        run: npm run check:config-keys --prefix frontend

      # Deliberately inside an already-required context rather than a new job.
      # A new check would not be in the branch ruleset, so it could go red
      # without blocking anything -- and a gate nobody has to pass teaches
      # people to walk past red.
      #
      # Named explicitly rather than left to the counterprobe: `node --test
      # scripts/*.test.cjs` in Delivery Contract Tests does pick the probe up and
      # its first assertion runs the scan, so the boundary is guarded either way.
      # But that is a glob happening to match a filename, and a rule that holds
      # by accident stops holding the moment somebody renames a file.
      - name: Check the Excalidraw adapter boundary
        run: node scripts/adapter-boundary.cjs

      - name: Check the notification facade boundary
        run: node scripts/notification-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/adapter-boundary.test.cjs

      - name: Check semantic stacking policy
        run: node scripts/stacking-policy.cjs

      - name: Prove stacking policy rejects raw values and ignores foreign CSS
        run: node scripts/stacking-policy.test.cjs

      # Same "already-required job, not a new one" reasoning as the adapter
      # boundary above -- the frontend logging boundary (NIL-510/NIL-513)
      # lives here for the identical reason as logging-boundary.cjs living in
      # backend-tests.
      - name: Check the frontend logging boundary
        run: node scripts/frontend-logging-boundary.cjs

      - name: Prove the frontend logging boundary check rejects what it claims to
        run: node scripts/frontend-logging-boundary.test.cjs

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx --no-install prisma generate

      - name: Typecheck backend
        run: npm run typecheck --prefix backend

  e2e-typecheck:
    name: E2E Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci --prefix e2e

      # Plain `tsc --noEmit`, not `tsc -b`: `e2e/tsconfig.json` has no
      # `references`/`composite` project setup (a single flat project), so
      # there is no project-references graph for `-b` to resolve that `-p`
      # would silently skip -- the trap that made `tsc -p tsconfig.json` on
      # #263 report green on a project it wasn't actually checking. `-b` is
      # only needed where composite references exist; using it here would
      # add nothing but confusion for the next reader wondering why.
      #
      # Playwright transpiles specs at runtime (esbuild) rather than
      # type-checking them, so a spec with a genuine type error can pass its
      # test run and still merge to `main` unnoticed -- this job is the only
      # place that type-level regression is ever caught (NIL-696).
      - name: Typecheck e2e
        run: npm run typecheck --prefix e2e

  authz-boundary:
    name: Authz Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependency install: the check reads backend/src with node:fs and
      # nothing else. That is deliberate -- a boundary check that needs a
      # package tree can only run where one was installed, and this one has to
      # be cheap enough to keep as its own required gate.
      - name: Check the board-ownership boundary
        run: node scripts/authz-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/authz-boundary.test.cjs

  agent-token-boundary:
    name: Agent Token Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependency install, same reasoning as Authz Boundary: this reads
      # backend/src with node:fs and nothing else.
      - name: Check the agent-token centralization
        run: node scripts/agent-token-boundary.cjs

      - name: Prove the boundary check rejects what it claims to
        run: node scripts/agent-token-boundary.test.cjs

  env-boundary:
    name: Env Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependency install, same reasoning as Authz Boundary: this reads
      # backend/src with node:fs and nothing else. Not yet in
      # ops/repository-rules.sh's required_status_checks -- NIL-505 adds that
      # in a follow-up after this merges, the same ordering Authz Boundary and
      # Agent Token Boundary used, so a brand new job name is never a required
      # check before it has run green on main at least once.
      - name: Check the process.env boundary (NIL-505)
        run: node scripts/env-boundary.cjs

      - name: Prove the env boundary check rejects what it claims to
        run: node scripts/env-boundary.test.cjs

  cors-header-boundary:
    name: CORS Header Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependency install, same reasoning as Env Boundary: this reads
      # frontend/src and backend/src/index.ts with node:fs and nothing else.
      # Not yet in ops/repository-rules.sh's required_status_checks -- a
      # follow-up adds that after this has run green on main at least once,
      # the same ordering Env Boundary and Authz Boundary used.
      - name: Check the CORS allowedHeaders boundary (NIL-586)
        run: node scripts/cors-header-boundary.cjs

      - name: Prove the CORS header boundary check rejects what it claims to
        run: node scripts/cors-header-boundary.test.cjs

  type-collision-inventory:
    name: Type Collision Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No dependency install, same reasoning as Authz Boundary: this reads
      # frontend/src and backend/src with node:fs and nothing else.
      - name: Check the string-union type inventory
        run: node scripts/type-collision-inventory.cjs

      - name: Prove the inventory rejects what it claims to
        run: node scripts/type-collision-inventory.test.cjs

  frontend-format:
    name: Frontend Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check --prefix frontend

  backend-format:
    name: Backend Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A dedicated job, not a step inside backend-tests (NIL-503): format:check
    # used to run as that job's first step under `bash -e`, so a formatting
    # issue aborted the job before `npm test` ever ran -- the job still
    # reported red as "Backend Tests", which reads as a test failure and
    # sends whoever is looking straight at the wrong thing. Three packages
    # hit exactly that reading in one day (NIL-501, NIL-502, NIL-503) before
    # anyone noticed the job that failed had never run a test. Splitting it
    # out the same way frontend-format already is means a formatting issue
    # says "Backend Format failed", nothing else, and backend-tests keeps
    # running even when it does.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend formatting
        run: npm run format:check --prefix backend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NIL-494: real Postgres coverage for migration SQL that an in-process
    # emulator cannot faithfully run (the NIL-326 migration's `DO $$ ...
    # EXCEPTION ... END $$` backfill block -- see
    # backend/src/__tests__/migrations/nil326SearchTextBackfill.postgres.test.ts).
    # Deliberately inside this already-required job rather than a new one:
    # a new job would not be in the branch ruleset, so it could go red
    # without blocking anything (see the same reasoning on
    # `frontend-typecheck`'s adapter-boundary check above). The logging
    # boundary (NIL-411/NIL-502) lives here for the identical reason.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: excalidash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The same decoders the container image carries. Tests that exercise them
      # skip themselves when the binary is missing, so without this a broken
      # decoder invocation passes as a green run.
      - name: Install document and image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick poppler-utils ghostscript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx --no-install prisma generate
          node -e 'const fs = require("node:fs"); fs.writeFileSync(`${process.env.RUNNER_TEMP}/nil-703-prisma-generate.json`, `${JSON.stringify({ finishedAt: new Date().toISOString(), pid: process.pid, cwd: process.cwd() })}\n`);'

      # NIL-703: this job crashed twice with "Failed Suites 1" naming an
      # unrelated test file and zero failed assertions -- both times the
      # actual cause was `backend/src/generated/client/package.json` being
      # unreadable, not anything the named test did. Catch that here, in one
      # line, right after the step that produces the client, instead of
      # letting the next occurrence cost another twenty minutes in test logs
      # where nothing failed.
      - name: Verify the generated Prisma client is usable
        run: |
          node scripts/prisma-client-integrity.cjs
          node -e 'const fs = require("node:fs"); fs.writeFileSync(`${process.env.RUNNER_TEMP}/nil-703-prisma-integrity.json`, `${JSON.stringify({ finishedAt: new Date().toISOString(), pid: process.pid, cwd: process.cwd() })}\n`);'

      - name: Prove the Prisma client integrity check rejects what it claims to
        run: node scripts/prisma-client-integrity.test.cjs

      - name: Check the backend logging boundary
        run: node scripts/logging-boundary.cjs

      - name: Prove the logging boundary check rejects what it claims to
        run: node scripts/logging-boundary.test.cjs

      - name: Run backend tests
        run: |
          cd backend
          npm test
        env:
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/excalidash_test
          NIL703_PRISMA_GENERATE_MARKER: ${{ runner.temp }}/nil-703-prisma-generate.json
          NIL703_PRISMA_INTEGRITY_MARKER: ${{ runner.temp }}/nil-703-prisma-integrity.json
          NIL703_PRISMA_DIAGNOSTIC_DIR: ${{ runner.temp }}/nil-703-prisma-client-resolution

      - name: Upload Prisma client-resolution diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nil-703-prisma-client-resolution
          path: ${{ runner.temp }}/nil-703-prisma-client-resolution
          if-no-files-found: ignore
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install package dependencies
        run: |
          npm ci

      - name: Check backend dead code
        run: npm run check:dead-code --prefix backend

      - name: Check frontend dead code
        run: npm run check:dead-code --prefix frontend

      - name: Prove dead-code detection in both directions
        run: node scripts/dead-code-counterprobe.cjs

  # Split across two runners rather than more workers. The suite deliberately
  # runs with workers: 1 because it shares one backend SQLite database and
  # cleans up by naming convention, so concurrency inside a job leaks between
  # tests. A separate job does not: it brings its own checkout, its own
  # database and its own servers.
  e2e-shards:
    name: E2E Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One red shard must not cut the other one short — both results are
      # wanted, otherwise a failure hides whatever the other half would say.
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx --no-install prisma generate

      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-test.db
      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx --no-install playwright install chromium --with-deps

      - name: Start servers and run E2E tests
        run: |
          # Start backend server in background
          cd backend
          # The suite issues far more than the default 60 CSRF requests, so
          # without raising the limits it locks itself out with HTTP 429.
          # Uploaded documents default to the path they live at inside the
          # container, which nothing outside it may create, so tests that add a
          # document need somewhere in the workspace to put it.
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-test.db" \
            FRONTEND_URL="http://localhost:6767" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            AGENT_FEATURES_ENABLED=true \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-assets" \
            npm run dev &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for backend to be ready
          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          # Start frontend server in background
          cd frontend
          npm run dev -- --host &
          FRONTEND_PID=$!
          cd ..

          # Wait for frontend to be ready
          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6767 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # 720s leaves several minutes of headroom under the job's 20-minute
          # ceiling for install/setup and this upload step.
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true timeout --signal=INT --kill-after=30s --preserve-status 720 \
            npx --no-install playwright test --project=chromium --shard=${{ matrix.shard }}/2 \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-test.db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report/
          retention-days: 7
          # Today's default (`warn`) prints a warning line that reads exactly
          # like a normal "nothing failed" run and is easy to miss in a wall
          # of red. `error` turns "the report itself never got produced" into
          # its own failed, visible step instead of a swallowed footnote.
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error

  # The other engines, in their own job rather than as more projects in the
  # shards. Same reasoning the shards are built on: one backend and one SQLite
  # file cannot take the same specs running four times over with the same board
  # names. Measured the hard way -- each project passed alone, and all four in
  # one job did not finish in an hour.
  #
  # Not sharded: firefox and webkit carry a small subset each, so a second
  # runner would cost more in setup than it saves.
  e2e-cross-engine:
    # One job per engine instead of all three in one (NIL-652).
    #
    # The single job ran the whole 130-test suite under an inner
    # `timeout ... 720` -- 12.0 minutes. The suite had grown into that wall:
    # measured on 2026-08-27, a passing run took 11.8 minutes, leaving twelve
    # seconds of margin, and a slower runner simply crossed it. What died was
    # then whichever test happened to be in flight at second 720, which is why
    # it looked like flakiness scattered across unrelated specs. It was not:
    # the failing run reported `121 passed, 1 interrupted` and zero failures.
    #
    # Split per engine, each job carries roughly a third of the work, installs
    # only the browser it needs, and gets its own budget. The engines are also
    # independent -- `fail-fast: false` so a WebKit break still reports what
    # Firefox did.
    name: E2E Cross-Engine (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: |
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx --no-install prisma generate

      - name: Setup backend database
        run: |
          cd backend
          node scripts/provider-prisma.cjs migrate deploy
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-cross.db
      - name: Install E2E test dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright browsers
        run: |
          cd e2e
          npx --no-install playwright install ${{ matrix.browser }} --with-deps

      - name: Start servers and run E2E tests
        run: |
          # Start backend server in background
          cd backend
          # The suite issues far more than the default 60 CSRF requests, so
          # without raising the limits it locks itself out with HTTP 429.
          # Uploaded documents default to the path they live at inside the
          # container, which nothing outside it may create, so tests that add a
          # document need somewhere in the workspace to put it.
          DATABASE_URL="file:${{ github.workspace }}/backend/prisma/e2e-cross.db" \
            FRONTEND_URL="http://localhost:6767" \
            CSRF_MAX_REQUESTS=100000 \
            RATE_LIMIT_MAX_REQUESTS=100000 \
            AGENT_FEATURES_ENABLED=true \
            ASSET_STORAGE_DIR="${{ github.workspace }}/backend/prisma/e2e-cross-assets" \
            npm run dev &
          BACKEND_PID=$!
          cd ..

          # Cleanup via trap, not a line after the test command: under
          # `bash -e` (this step's default shell) a nonzero exit from that
          # command ends the script immediately, so a cleanup line placed
          # after it never runs in exactly the case it exists for. A trap
          # fires on every exit path -- success, `-e` abort, or the explicit
          # `exit` below -- so it actually keeps the promise its name makes.
          FRONTEND_PID=""
          cleanup() {
            echo "Cleanup: stopping backend/frontend servers"
            [ -n "$BACKEND_PID" ] && kill "$BACKEND_PID" 2>/dev/null || true
            [ -n "$FRONTEND_PID" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for backend to be ready
          echo "Waiting for backend server..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet..."
            sleep 2
          done

          # Start frontend server in background
          cd frontend
          npm run dev -- --host &
          FRONTEND_PID=$!
          cd ..

          # Wait for frontend to be ready
          echo "Waiting for frontend server..."
          for i in {1..30}; do
            if curl -s http://localhost:6767 > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: Frontend not ready yet..."
            sleep 2
          done

          # Run E2E tests. Wrapped in our own `timeout` rather than trusting
          # the job's 20-minute cancellation to leave a report behind: that
          # cancellation does not reliably give Playwright the chance to
          # write one (verified locally -- SIGTERM kills the process before
          # it can write anything, SIGINT lets it finish the run as
          # "interrupted" and write report/trace/video for what already ran).
          # `--preserve-status` keeps the real pass/fail exit code instead of
          # always reporting 124.
          #
          # 660s for ONE engine, where all three together used to share 720s
          # (NIL-652). A third of the suite finished well inside four minutes
          # in the measured runs, so this is deliberate slack, not a new
          # ceiling to grow into. If a single engine ever approaches it, that
          # is a real signal worth reading rather than a budget to raise --
          # the previous wall taught that lesson by looking like flakiness for
          # a day.
          cd e2e
          TEST_EXIT_CODE=0
          NO_SERVER=true CI=true timeout --signal=INT --kill-after=30s --preserve-status 660 \
            npx --no-install playwright test --project=${{ matrix.project }} \
            || TEST_EXIT_CODE=$?
          cd ..

          exit "$TEST_EXIT_CODE"
        env:
          DATABASE_URL: file:${{ github.workspace }}/backend/prisma/e2e-cross.db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-cross-engine-${{ matrix.project }}
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-cross-engine-${{ matrix.project }}
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: error

